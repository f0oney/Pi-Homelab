version: "3.8"
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINXVOLUME}:/etc/nginx/conf.d:ro
      - ${CERTSVOLUME}:/etc/openssl/certificates:ro
      - ${KEYSVOLUME}:/etc/openssl/keys:ro
    networks:
      - swarm_network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  swarm_network:
    external: true
