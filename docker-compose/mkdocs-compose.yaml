services:
  mkdocs:
    image: squidfunk/mkdocs-material
    container_name: mkdocs
    dns:
      - ${UNBOUND_DOCKER_IP}
      - ${PI_IP}
    networks:
      swarm_network:
    volumes:
      - ${MKDOCS_VOLUME}:/docs
      - ${MKDOCS_SSH_VOLUME}:/root/.ssh:ro
      - $SSH_AUTH_SOCK:/ssh-agent
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
    stdin_open: true
    tty: true

networks:
  swarm_network:
    external: true
    attachable: true
    driver: overlay


