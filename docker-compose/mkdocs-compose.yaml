services:
  mkdocs:
    image: squidfunk/mkdocs-material
    container_name: mkdocs
    dns:
      - ${UNBOUND_DOCKER_IP}
      - ${PI_IP}
    networks:
      swarm_network:
    volumes:
      - ${MKDOCS_VOLUME}:/docs
      - ${HOME}/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      - ${HOME}/.ssh-agent:/ssh-agent-dir
    environment:
      - SSH_AUTH_SOCK=/ssh-agent-dir/agent.sock
    stdin_open: true
    tty: true

networks:
  swarm_network:
    external: true
    attachable: true
    driver: overlay


